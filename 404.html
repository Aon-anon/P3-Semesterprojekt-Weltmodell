<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Seite nicht gefunden</title>
    <script>
      (function () {
        var base = "/P3-Semesterprojekt-Weltmodell";
        var path = window.location.pathname;
        var redirect = path.substring(base.length);
        if (!redirect || redirect === "/") redirect = "/";
        window.location.replace(base + "/?redirect=" + encodeURIComponent(redirect));
      })();
    </script>
  </head>
  <body>
    <p>Weiterleitung zur Anwendung...</p>
    <p><a href="/P3-Semesterprojekt-Weltmodell/">Zurück zur Startseite</a></p>
  </body>
</html>
